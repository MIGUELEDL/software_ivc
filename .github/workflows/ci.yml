name: ci

# R11: sem isto o workflow herda o padrao do repositorio, que dependendo do
# setup pode incluir escrita. Estes jobs so precisam LER o repositorio: o mais
# apertado que ainda funciona.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Code gates (lint / typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Probes de dominio sem servidor/DB: compilam os modulos puros e os
      # EXECUTAM com stubs (barcode: code128+cartao+validade; auditoria:
      # service layer com stub de @/lib/supabase/server). Sem isto, os gaps
      # apontados pelos verifiers (AUD-01/02/03/08..11, BRC-04) so existiam
      # em scripts que ninguem rodava.
      - run: npm run probe:barcode
      - run: npm run probe:admin-auditoria

  # AD-023 (parcial): a barreira de valor do cartao de validade era a UNICA
  # evidencia executavel da feature, e ela vivia FORA do CI. A R10 mediu o
  # preco: trocar `process.exit(1)` por `console.log(TOKEN)` no catch da tier
  # auto-certificava o sucesso dela, e tres mutantes que morrem com o harness
  # intacto viravam verdes — sem ninguem ver, porque ninguem rodava. Um gate
  # que pode apodrecer em silencio nao e gate.
  cartao:
    name: Probe cartao-valididade (dominio + postgres + matriz de fuso)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Dominio: sem Docker. Inclui a tier que EXECUTA os 4 services de escrita
      # e as 3 rotas, com o token e o canario.
      - name: Probe de dominio
        run: npm run probe:cartao

      # Com Postgres: `--com-db` sobe um container efemero e roda a migration
      # 0024 de verdade (trigger, backfill, fuso, atomicidade).
      - name: Probe com Postgres efemero
        run: npm run probe:cartao:db

      # O calculo e civil e NAO pode variar com o TZ do processo (Vercel roda
      # UTC). Rodar so em UTC deixaria passar um `toISOString()` disfarçado.
      - name: Matriz de fuso
        run: |
          # A R11 mediu o dia civil da igreja sobreviver em TODOS estes quatro
          # fusos, porque todos tem offset >= 0 — e nenhum fuso com offset
          # >= 0 distingue o dia da igreja do dia UTC. Somado a isso, nenhum
          # destes e o offset de producao. America/Sao_Paulo e' o fuso da
          # igreja (FUSO_CIVIL em validade.ts) e o unico que pega o
          # `civilDe -> toISOString`; o hemisferio oeste entra por causa do
          # rollover de ano.
          for tz in UTC America/Sao_Paulo America/Los_Angeles Asia/Tokyo Pacific/Kiritimati Europe/Lisbon; do
            echo "== TZ=$tz"
            TZ="$tz" npm run probe:cartao --silent -- --domain
          done

      # O container efemero declara VOLUME no PGDATA: sem esta checagem, cada
      # execucao deixa um volume anonimo para tras. Foi assim que 11 se
      # acumularam entre R1 e R6.
      - name: Sem volume vazado
        run: |
          n="$(docker volume ls -q --filter dangling=true | wc -l)"
          echo "volumes dangling: $n"
          [ "$n" -eq 0 ] || { echo "a probe vazou volume"; exit 1; }

  specs:
    name: Spec structural gates (validate_spec / validate_tasks / validate_state)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate feature specs and completion states
        run: |
          SKILL_DIR=.opencode/skills/tlc-spec-driven
          features=()
          for d in .specs/features/*/; do
            [ -e "$d/spec.md" ] || continue
            features+=("$(basename "$d")")
          done
          if [ ${#features[@]} -eq 0 ]; then
            echo "no features found"
            exit 0
          fi
          for f in "${features[@]}"; do
            python3 "$SKILL_DIR/scripts/validate_spec.py" "$f"
            # A R11 notou que validate_tasks nao rodava em lugar nenhum da CI.
            # Spec e tasks sao a mesma promessa por lados diferentes: a spec
            # diz o que tem de ser verdade, a tasks diz o que foi de fato
            # construido. Validar so uma delas deixa a outra passar de graca.
            if [ -e ".specs/features/$f/tasks.md" ]; then
              python3 "$SKILL_DIR/scripts/validate_tasks.py" "$f"
            fi
            if [ -e ".specs/features/$f/validation.md" ]; then
              python3 "$SKILL_DIR/scripts/validate_state.py" "$f"
            fi
          done